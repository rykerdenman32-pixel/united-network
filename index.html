```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>United Network</title>

  <style>
    :root {
      --bg: #020817;
      --bg-2: #06132d;
      --panel: rgba(7, 25, 58, 0.88);
      --panel-2: rgba(10, 35, 75, 0.92);
      --border: rgba(72, 159, 255, 0.28);
      --blue: #1597ff;
      --blue-2: #62c8ff;
      --text: #f3f8ff;
      --muted: #91a8c8;
      --danger: #ff5c76;
      --success: #47e7a1;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 20%, rgba(0, 113, 255, 0.18), transparent 30%),
        radial-gradient(circle at 10% 80%, rgba(0, 100, 255, 0.12), transparent 30%),
        linear-gradient(135deg, #010612, #03102a 45%, #010713);
      background-attachment: fixed;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at center, rgba(0, 130, 255, 0.18), transparent 35%),
        #010611;
    }

    .auth-card {
      width: min(440px, 100%);
      padding: 34px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(4, 17, 40, 0.94);
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(18px);
    }

    .auth-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 20px rgba(30, 157, 255, 0.55));
    }

    .auth-card h1 {
      font-size: 34px;
      letter-spacing: 2px;
    }

    .auth-card h1 span {
      color: var(--blue-2);
    }

    .auth-subtitle {
      color: var(--muted);
      margin: 8px 0 28px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
    }

    .auth-form label {
      font-size: 13px;
      color: var(--muted);
    }

    .auth-form input,
    .auth-form textarea,
    .form-input {
      width: 100%;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline: none;
      color: white;
      background: rgba(0, 10, 28, 0.75);
    }

    input:focus,
    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(21, 151, 255, 0.1);
    }

    .auth-switch {
      margin-top: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .auth-switch button {
      background: none;
      border: none;
      color: var(--blue-2);
      font-weight: bold;
    }

    /* =========================
       BUTTONS
    ========================= */

    .primary-button,
    .secondary-button,
    .danger-button,
    .icon-button {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 15px;
      color: white;
      background: rgba(11, 55, 112, 0.75);
      transition: 0.2s ease;
    }

    .primary-button {
      background: linear-gradient(135deg, #087ee8, #18b8ff);
      border-color: rgba(130, 220, 255, 0.55);
      font-weight: bold;
    }

    .primary-button:hover,
    .secondary-button:hover,
    .icon-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.12);
    }

    .danger-button {
      background: rgba(120, 15, 38, 0.55);
      border-color: rgba(255, 92, 118, 0.35);
    }

    .icon-button {
      width: 42px;
      height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 19px;
    }

    /* =========================
       APP LAYOUT
    ========================= */

    #app {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 76px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(1, 9, 25, 0.94);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
    }

    .brand img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(21, 151, 255, 0.5));
    }

    .brand-text strong {
      display: block;
      font-size: 20px;
      letter-spacing: 1px;
    }

    .brand-text span {
      font-size: 8px;
      letter-spacing: 1.5px;
      color: var(--blue-2);
    }

    .topnav {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
    }

    .nav-button {
      border: none;
      background: transparent;
      color: #c8d8ee;
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .nav-button:hover,
    .nav-button.active {
      background: rgba(17, 103, 200, 0.2);
      color: white;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .mobile-menu {
      display: none;
    }

    .layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr) 310px;
      max-width: 1500px;
      margin: auto;
      min-height: calc(100vh - 76px);
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      padding: 22px 14px;
      border-right: 1px solid rgba(72, 159, 255, 0.14);
    }

    .side-profile {
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      text-align: center;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(70, 190, 255, 0.65);
      background: #0a2348;
    }

    .large-avatar {
      width: 88px;
      height: 88px;
    }

    .side-profile .avatar {
      margin-bottom: 10px;
    }

    .side-profile strong {
      display: block;
    }

    .side-profile small {
      color: var(--muted);
    }

    .side-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .side-nav button {
      width: 100%;
      text-align: left;
      padding: 13px 15px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #bfd0e7;
      background: transparent;
    }

    .side-nav button:hover,
    .side-nav button.active {
      background: rgba(17, 103, 200, 0.2);
      border-color: rgba(45, 143, 235, 0.15);
      color: white;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      min-width: 0;
      padding: 24px;
    }

    .page {
      max-width: 820px;
      margin: auto;
    }

    .hero {
      position: relative;
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 22px;
      margin-bottom: 22px;
      background:
        radial-gradient(circle at center, rgba(0, 128, 255, 0.22), transparent 40%),
        linear-gradient(135deg, rgba(3, 18, 48, 0.96), rgba(1, 8, 24, 0.95));
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1px);
      background-size: 65px 65px;
      opacity: .08;
    }

    .hero-content {
      position: relative;
      text-align: center;
      padding: 30px;
    }

    .hero-logo {
      width: min(500px, 90%);
      max-height: 300px;
      object-fit: contain;
      filter: drop-shadow(0 0 28px rgba(0, 151, 255, 0.55));
    }

    .hero h1 {
      font-size: clamp(34px, 6vw, 64px);
      letter-spacing: 4px;
    }

    .hero h1 span {
      color: var(--blue-2);
    }

    .hero p {
      color: #a9c8eb;
      letter-spacing: 3px;
      font-size: 12px;
      margin-top: 8px;
    }

    .page-title {
      font-size: 28px;
      margin-bottom: 18px;
    }

    .composer {
      padding: 16px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    .composer-row {
      display: flex;
      gap: 12px;
    }

    .composer textarea {
      flex: 1;
      min-height: 80px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      color: white;
      background: rgba(0, 9, 27, .65);
      outline: none;
    }

    .composer-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    /* =========================
       POSTS
    ========================= */

    .post {
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--panel);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .16);
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 15px;
    }

    .post-user {
      flex: 1;
    }

    .post-user strong {
      display: block;
    }

    .post-user small {
      color: var(--muted);
    }

    .post-text {
      line-height: 1.65;
      white-space: pre-wrap;
      margin-bottom: 14px;
    }

    .post-image {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .post-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid rgba(72, 159, 255, .13);
      padding-top: 12px;
    }

    .post-actions button {
      border: none;
      border-radius: 8px;
      padding: 8px 11px;
      color: #9db5d4;
      background: transparent;
    }

    .post-actions button:hover,
    .post-actions button.liked {
      color: #64c8ff;
      background: rgba(21, 151, 255, .1);
    }

    .comment-box {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .comment-box input {
      flex: 1;
      padding: 10px;
      color: white;
      background: rgba(0, 10, 28, .7);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
    }

    .comments {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .comment {
      padding: 9px 11px;
      border-radius: 9px;
      background: rgba(0, 0, 0, .18);
      color: #c7d7eb;
      font-size: 14px;
    }

    /* =========================
       RIGHT SIDEBAR
    ========================= */

    .rightbar {
      padding: 22px 14px;
      border-left: 1px solid rgba(72, 159, 255, 0.14);
    }

    .widget {
      padding: 17px;
      margin-bottom: 15px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    .widget-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .widget-title h3 {
      font-size: 17px;
    }

    .widget-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(72, 159, 255, .1);
    }

    .widget-item:last-child {
      border-bottom: none;
    }

    .widget-item-info {
      flex: 1;
      min-width: 0;
    }

    .widget-item-info strong,
    .widget-item-info small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .widget-item-info small {
      color: var(--muted);
      margin-top: 3px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search-box input {
      flex: 1;
      padding: 14px;
      color: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      outline: none;
    }

    .search-result {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel);
    }

    .search-result-info {
      flex: 1;
    }

    .search-result-info small {
      color: var(--muted);
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
    }

    .profile-cover {
      height: 170px;
      background:
        radial-gradient(circle at 50% 20%, rgba(40, 181, 255, .35), transparent 35%),
        linear-gradient(135deg, #061c48, #02091c);
    }

    .profile-customizer {
      margin-top: 22px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(2, 9, 28, .45);
    }

    .profile-customizer h3 {
      margin-bottom: 6px;
    }

    .customizer-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .customizer-option {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    .customizer-option label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .customizer-option input[type="color"] {
      width: 100%;
      height: 42px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      cursor: pointer;
    }

    .customizer-file {
      margin-top: 8px;
      width: 100%;
      color: var(--muted);
    }

    .customizer-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .customizer-preview-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #06122d;
    }

    .search-result-badge,
    .notification-badge,
    .community-badge {
      min-width: 64px;
      padding: 5px 7px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .profile-content {
      padding: 0 25px 25px;
    }

    .profile-avatar-wrap {
      margin-top: -50px;
      margin-bottom: 14px;
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #06122d;
      object-fit: cover;
      background: #0a2348;
    }

    .profile-content h1 {
      font-size: 28px;
    }

    .profile-content p {
      color: var(--muted);
      margin-top: 7px;
    }

    .profile-stats {
      display: flex;
      gap: 30px;
      margin-top: 20px;
    }

    .profile-stat strong,
    .profile-stat span {
      display: block;
    }

    .profile-stat span {
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       COMMUNITIES
    ========================= */

    .community-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .community-card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    .community-card h2 {
      margin-bottom: 5px;
    }

    .community-card p {
      color: var(--muted);
      margin-bottom: 18px;
    }

    .community-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* =========================
       MESSAGES
    ========================= */

    .messages-layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      min-height: 500px;
      border: 1px solid var(--border);
      border-radius: 17px;
      overflow: hidden;
      background: var(--panel);
    }

    .conversation-list {
      border-right: 1px solid var(--border);
    }

    .conversation {
      padding: 15px;
      border-bottom: 1px solid rgba(72, 159, 255, .1);
      cursor: pointer;
    }

    .conversation:hover,
    .conversation.active {
      background: rgba(21, 151, 255, .12);
    }

    .chat {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      padding: 17px;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
    }

    .chat-messages {
      flex: 1;
      min-height: 340px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 13px;
      border-radius: 13px;
      background: rgba(31, 62, 107, .65);
      align-self: flex-start;
    }

    .bubble.mine {
      align-self: flex-end;
      background: linear-gradient(135deg, #096fc9, #087fcf);
    }

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 13px;
      border-top: 1px solid var(--border);
    }

    .chat-input input {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: white;
      background: rgba(0, 10, 28, .7);
      outline: none;
    }

    /* =========================
       SETTINGS
    ========================= */

    .settings-card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    .settings-group {
      margin-bottom: 25px;
    }

    .settings-group h3 {
      margin-bottom: 12px;
    }

    .settings-group p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 12px;
    }

    /* =========================
       NOTIFICATIONS
    ========================= */

    .notification {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 15px;
      margin-bottom: 9px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    .empty-state {
      padding: 35px;
      border: 1px dashed var(--border);
      border-radius: 15px;
      color: var(--muted);
      text-align: center;
    }

    /* =========================
       TOAST
    ========================= */

    #toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 500;
      padding: 13px 17px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(4, 19, 45, .96);
      box-shadow: var(--shadow);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: .25s;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 190px minmax(0, 1fr);
      }

      .rightbar {
        display: none;
      }

      .brand {
        min-width: 180px;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        height: 64px;
        padding: 0 12px;
      }

      .brand-text {
        display: none;
      }

      .brand {
        min-width: auto;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .topnav {
        display: none;
      }

      .mobile-menu {
        display: grid;
      }

      .layout {
        display: block;
      }

      .sidebar {
        display: none;
      }

      .sidebar.mobile-open {
        display: block;
        position: fixed;
        top: 64px;
        left: 0;
        bottom: 0;
        width: 270px;
        z-index: 90;
        background: #020b20;
        box-shadow: var(--shadow);
      }

      .main {
        padding: 14px;
      }

      .hero {
        min-height: 230px;
      }

      .hero-logo {
        width: 90%;
      }

      .community-grid {
        grid-template-columns: 1fr;
      }

      .messages-layout {
        grid-template-columns: 1fr;
      }

      .conversation-list {
        display: none;
      }

      .page-title {
        font-size: 24px;
      }
    }
  </style>

<style id="united-groups-final-styles">

<body>

  <!-- =========================
       AUTH SCREEN
  ========================== -->

  <section id="authScreen">
    <div class="auth-card">

      <!-- Put your actual logo at public/united-network-logo.png
           if you later move this project into a React/Vite project. -->
      <img
        src="united-network-logo.png"
        alt="United Network"
        class="auth-logo"
        onerror="this.style.display='none'"
      />

      <h1>UNITED <span>NETWORK</span></h1>

      <p class="auth-subtitle">
        Real People • Real Connections • One Community
      </p>

      <div id="loginForm" class="auth-form">
        <label>Username</label>
        <input id="loginUsername" type="text" placeholder="Username" />

        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Password" />

        <button class="primary-button" onclick="login()">
          Log In

        <div class="auth-switch">
          Don't have an account?
          <button onclick="showSignup()">Create one</button>
        </div>
      </div>

      <div id="signupForm" class="auth-form hidden">
        <label>Username</label>
        <input id="signupUsername" type="text" placeholder="Choose a username" />

        <label>Password</label>
        <input id="signupPassword" type="password" placeholder="Choose a password" />

        <label>Bio</label>
        <textarea id="signupBio" placeholder="Tell people about yourself"></textarea>

        <button class="primary-button" onclick="signup()">
          Create Account
        </button>

        <div class="auth-switch">
          Already have an account?
          <button onclick="showLogin()">Log in</button>
        </div>
      </div>

    </div>
  </section>


  <!-- =========================
       APPLICATION
  ========================== -->

  <div id="app" class="hidden">

    <header class="topbar">

      <button
        class="icon-button mobile-menu"
        onclick="toggleMobileMenu()"
        title="Menu"
      >
        ☰
      </button>

      <div class="brand">
        <img
          src="united-network-logo.png"
          alt="United Network"
          onerror="this.style.display='none'"
        />

        <div class="brand-text">
          <strong>UNITED NETWORK</strong>
          <span>REAL PEOPLE • REAL CONNECTIONS • ONE COMMUNITY</span>
        </div>
      </div>

      <nav class="topnav">
        <button class="nav-button active" data-page="home" onclick="navigate('home')">
          Home
        </button>

        <button class="nav-button" data-page="communities" onclick="navigate('communities')">
          Communities
        </button>

        <button class="nav-button" data-page="messages" onclick="navigate('messages')">
          Messages
        </button>

        <button class="nav-button" data-page="search" onclick="navigate('search')">

        </button>
      </nav>

      <div class="top-actions">
        <button class="nav-button" onclick="openCreatePost()" title="Create Post">
          Create Post
        </button>

        <button class="nav-button" onclick="navigate('notifications')" title="Notifications">
          Notifications
        </button>

        <button class="nav-button" onclick="navigate('profile')" title="Profile">
          Profile
        </button>
      </div>

    </header>


    <div class="layout">

      <!-- =========================
           LEFT SIDEBAR
      ========================== -->

      <aside id="sidebar" class="sidebar">

        <div class="side-profile">
          <img id="sideAvatar" class="avatar large-avatar" src="default.png" alt="Profile" />
          <strong id="sideUsername">User</strong>
          <small id="sideBio">Welcome!</small>
        </div>

        <nav class="side-nav">

          <button data-page="home" onclick="navigate('home')">
            Home
          </button>

          <button data-page="communities" onclick="navigate('communities')">
            Communities
          </button>

          <button data-page="messages" onclick="navigate('messages')">
            Messages
          </button>

          <button data-page="search" onclick="navigate('search')">
            Search
          </button>

          <button data-page="profile" onclick="navigate('profile')">
            My Profile
          </button>

          <button data-page="notifications" onclick="navigate('notifications')">
            Notifications
          </button>

          <button data-page="settings" onclick="navigate('settings')">
            Settings
          </button>

        </nav>

      </aside>


      <!-- =========================
           MAIN CONTENT
      ========================== -->

      <main id="mainContent" class="main"></main>


      <!-- =========================
           RIGHT SIDEBAR
      ========================== -->

      <aside class="rightbar">

        <div class="widget">

          <div class="widget-title">
            <h3>Notifications</h3>
            <button
              class="secondary-button"
              onclick="navigate('notifications')"
            >
              View
            </button>
          </div>

          <div id="rightNotifications"></div>

        </div>


        <div class="widget">

          <div class="widget-title">
            <h3>Communities</h3>
            <button
              class="secondary-button"
              onclick="navigate('communities')"
            >
              View
            </button>
          </div>

          <div id="rightCommunities"></div>

        </div>


        <div class="widget">

          <div class="widget-title">
            <h3>Who to follow</h3>
          </div>

          <div id="rightPeople"></div>

        </div>

      </aside>

    </div>

  </div>


  <div id="toast"></div>


  <script>

    /* =========================================================
       UNITED NETWORK
       Single-file application
       Browser prototype using localStorage
    ========================================================= */


    /* =========================
       DEFAULT DATA
    ========================== */

    const DEFAULT_USERS = [
      {
        username: "demo_user",
        password: "demo123",
        bio: "Welcome to United Network!",
        avatar: "default.png",
        profileColor: "#1597ff",
        coverColor: "#061c48",
        followers: 12,
        following: 7
      },
      {
        username: "demo_friend",
        password: "demo123",
        bio: "Here to connect with people.",
        avatar: "default.png",
        profileColor: "#1597ff",
        coverColor: "#061c48",
        followers: 18,
        following: 11
      },
      {
        username: "new_user",
        password: "demo123",
        bio: "Hello! I'm new here.",
        avatar: "default.png",
        profileColor: "#1597ff",
        coverColor: "#061c48",
        followers: 4,
        following: 2
      }
    ];

    const DEFAULT_POSTS = [
      {
        id: 1,
        username: "demo_user",
        text: "Welcome to United Network!",
        likes: 3,
        likedBy: [],
        comments: [],
        createdAt: Date.now()
      },
      {
        id: 2,
        username: "demo_friend",
        text: "This is a place for real people and real connections.",
        likes: 5,
        likedBy: [],
        comments: [],
        createdAt: Date.now() - 50000
      }
    ];

    const DEFAULT_COMMUNITIES = [
      {
        id: 1,
        name: "Gaming",
        description: "Talk about games, gaming news, and gaming communities.",
        members: 124,
        joinedBy: []
      },
      {
        id: 2,
        name: "Tech Talk",
        description: "Technology, computers, coding, and ideas.",
        members: 89,
        joinedBy: []
      },
      {
        id: 3,
        name: "Creative Corner",
        description: "Art, design, photography, music, and creativity.",
        members: 76,
        joinedBy: []
      },
      {
        id: 4,
        name: "Cars",
        description: "Cars, builds, restoration, and automotive discussion.",
        members: 61,
        joinedBy: []
      }
    ];

    const DEFAULT_MESSAGES = [
      {
        id: 1,
        with: "demo_friend",
        messages: [
          {
            from: "demo_friend",
            text: "Hey! Welcome to United Network!",
            time: Date.now() - 60000
          }
        ]
      }
    ];


    /* =========================
       LOCAL STORAGE
    ========================== */

    function loadData(key, fallback) {
      const saved = localStorage.getItem(key);

      if (!saved) {
        return fallback;
      }

      try {
        return JSON.parse(saved);
      } catch {
        return fallback;
      }
    }

    let users = loadData("un_users", DEFAULT_USERS);

    users.forEach(user => {
      if (!user.profileColor) user.profileColor = "#1597ff";
      if (!user.coverColor) user.coverColor = "#061c48";
      if (!user.avatar) user.avatar = "default.png";
    });

    let posts = loadData("un_posts", DEFAULT_POSTS);
    let communities = loadData("un_communities", DEFAULT_COMMUNITIES);
    let messages = loadData("un_messages", DEFAULT_MESSAGES);
    let notifications = loadData("un_notifications", []);
    let follows = loadData("un_follows", {});

    let currentUser = loadData("un_current_user", null);
    let currentPage = "home";
    let activeConversation = null;


    function saveData() {
      localStorage.setItem("un_users", JSON.stringify(users));
      localStorage.setItem("un_posts", JSON.stringify(posts));
      localStorage.setItem("un_communities", JSON.stringify(communities));
      localStorage.setItem("un_messages", JSON.stringify(messages));
      localStorage.setItem("un_notifications", JSON.stringify(notifications));
      localStorage.setItem("un_follows", JSON.stringify(follows));
      localStorage.setItem("un_current_user", JSON.stringify(currentUser));
    }


    /* =========================
       AUTH
    ========================== */

    function showLogin() {
      document.getElementById("loginForm").classList.remove("hidden");
      document.getElementById("signupForm").classList.add("hidden");
    }

    function showSignup() {
      document.getElementById("signupForm").classList.remove("hidden");
      document.getElementById("loginForm").classList.add("hidden");
    }

    function signup() {

      const username =
        document.getElementById("signupUsername").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      const bio =
        document.getElementById("signupBio").value.trim();

      if (!username || !password) {
        toast("Please enter a username and password.");
        return;
      }

      if (username.length < 3) {
        toast("Username must be at least 3 characters.");
        return;
      }

      const exists = users.some(
        user => user.username.toLowerCase() === username.toLowerCase()
      );

      if (exists) {
        toast("That username already exists.");
        return;
      }

      const newUser = {
        username,
        password,
        bio: bio || "New member of United Network.",
        avatar: "default.png",
        profileColor: "#1597ff",
        coverColor: "#061c48",
        followers: 0,
        following: 0
      };

      users.push(newUser);

      currentUser = username;

      saveData();

      openApp();

      toast("Account created!");
    }


    function login() {

      const username =
        document.getElementById("loginUsername").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const user = users.find(
        item =>
          item.username.toLowerCase() === username.toLowerCase() &&
          item.password === password
      );

      if (!user) {
        toast("Incorrect username or password.");
        return;
      }

      currentUser = user.username;

      saveData();

      openApp();

      toast("Welcome back!");
    }


    function logout() {

      currentUser = null;

      saveData();

      document.getElementById("app").classList.add("hidden");
      document.getElementById("authScreen").classList.remove("hidden");

      showLogin();

      toast("You have been logged out.");
    }


    function openApp() {

      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");

      updateUserUI();
      renderRightSidebar();
      navigate("home");
    }


    /* =========================
       CURRENT USER
    ========================== */

    function getCurrentUser() {

      return users.find(
        user => user.username === currentUser
      );
    }


    function updateUserUI() {

      const user = getCurrentUser();

      if (!user) {
        return;
      }

      document.getElementById("sideUsername").textContent =
        user.username;

      document.getElementById("sideBio").textContent =
        user.bio || "United Network member.";

      const sideAvatar = document.getElementById("sideAvatar");

      sideAvatar.src =
        user.avatar || "default.png";

      sideAvatar.style.borderColor =
        safeColor(user.profileColor, "#1597ff");
    }


    /* =========================
       NAVIGATION
    ========================== */

    function navigate(page) {

      currentPage = page;

      document
        .querySelectorAll("[data-page]")
        .forEach(button => {
          button.classList.toggle(
            "active",
            button.dataset.page === page
          );
        });

      renderPage(page);

      const sidebar =
        document.getElementById("sidebar");

      sidebar.classList.remove("mobile-open");
    }


    function renderPage(page) {

      const main =
        document.getElementById("mainContent");

      if (page === "home") {
        renderHome();
      }

      else if (page === "communities") {
        renderCommunities();
      }

      else if (page === "messages") {
        renderMessages();
      }

      else if (page === "search") {
        renderSearch();
      }

      else if (page === "profile") {
        renderProfile(currentUser);
      }

      else if (page === "notifications") {
        renderNotifications();
      }

      else if (page === "settings") {
        renderSettings();
      }

      else {
        main.innerHTML =
          `<div class="page"><h1>Page not found</h1></div>`;
      }
    }


    /* =========================
       HOME
    ========================== */

    function renderHome() {

      const main =
        document.getElementById("mainContent");

      const user = getCurrentUser();

      main.innerHTML = `

        <div class="page">

          <section class="hero">

            <div class="hero-content">

              <img
                src="united-network-logo.png"
                alt="United Network"
                class="hero-logo"
                onerror="this.outerHTML = '<h1>UNITED <span>NETWORK</span></h1><p>REAL PEOPLE • REAL CONNECTIONS • ONE COMMUNITY</p>'"
              />

            </div>

          </section>

          <h1 class="page-title">Feed</h1>

          <section class="composer">

            <div class="composer-row">

              <img
                class="avatar"
                src="${user.avatar || "default.png"}"
                alt=""
              />

              <textarea
                id="postInput"
                placeholder="What's happening?"
              ></textarea>

            </div>

            <div class="composer-actions">

              <button
                class="primary-button"
                onclick="createPost()"
              >
                Post
              </button>

            </div>

          </section>

          <div id="feed"></div>

        </div>
      `;

      renderFeed();
    }


    function renderFeed() {

      const feed =
        document.getElementById("feed");

      if (!feed) {
        return;
      }

      const sortedPosts = [...posts].sort(
        (a, b) => b.createdAt - a.createdAt
      );

      if (sortedPosts.length === 0) {

        feed.innerHTML = `
          <div class="empty-state">
            No posts yet. Be the first person to post!
          </div>
        `;

        return;
      }

      feed.innerHTML =
        sortedPosts.map(post => createPostHTML(post)).join("");
    }


    function createPostHTML(post) {

      const author = users.find(
        user => user.username === post.username
      );

      const avatar =
        author?.avatar || "default.png";

      const liked =
        post.likedBy?.includes(currentUser);

      const comments =
        post.comments || [];

      return `

        <article class="post">

          <div class="post-header">

            <img
              src="${escapeHTML(avatar)}"
              class="avatar"
              alt=""
            />

            <div class="post-user">

              <strong>
                ${escapeHTML(post.username)}
              </strong>

              <small>
                ${formatTime(post.createdAt)}
              </small>

            </div>

            ${
              post.username === currentUser
                ? `
                  <button
                    class="danger-button"
                    onclick="deletePost(${post.id})"
                  >
                    Delete
                  </button>
                `
                : ""
            }

          </div>

          <p class="post-text">
            ${escapeHTML(post.text)}
          </p>

          ${
            post.image
              ? `
                <img
                  src="${escapeHTML(post.image)}"
                  class="post-image"
                  alt="Post image"
                />
              `
              : ""
          }

          <div class="post-actions">

            <button
              class="${liked ? "liked" : ""}"
              onclick="toggleLike(${post.id})"
            >
              ${liked ? "❤️" : "♡"}
              ${post.likes || 0}
            </button>

            <button onclick="focusComment(${post.id})">
              ${comments.length}
            </button>

          </div>

          <div class="comments">

            ${
              comments.map(comment => `
                <div class="comment">
                  <strong>
                    ${escapeHTML(comment.username)}
                  </strong>
                  ${escapeHTML(comment.text)}
                </div>
              `).join("")
            }

          </div>

          <div class="comment-box">

            <input
              id="comment-${post.id}"
              placeholder="Write a comment..."
              onkeydown="commentKey(event, ${post.id})"
            />

            <button
              class="secondary-button"
              onclick="addComment(${post.id})"
            >
              Comment
            </button>

          </div>

        </article>
      `;
    }


    /* =========================
       POSTS
    ========================== */

    function createPost() {

      const input =
        document.getElementById("postInput");

      if (!input) {
        return;
      }

      const text =
        input.value.trim();

      if (!text) {
        toast("Write something first.");
        return;
      }

      posts.push({
        id: Date.now(),
        username: currentUser,
        text,
        likes: 0,
        likedBy: [],
        comments: [],
        createdAt: Date.now()
      });

      saveData();

      input.value = "";

      renderFeed();

      toast("Post published!");
    }


    function openCreatePost() {

      navigate("home");

      setTimeout(() => {

        const input =
          document.getElementById("postInput");

        if (input) {
          input.focus();
        }

      }, 50);
    }


    function toggleLike(id) {

      const post =
        posts.find(item => item.id === id);

      if (!post) {
        return;
      }

      if (!post.likedBy) {
        post.likedBy = [];
      }

      const index =
        post.likedBy.indexOf(currentUser);

      if (index >= 0) {

        post.likedBy.splice(index, 1);

        post.likes =
          Math.max(0, (post.likes || 0) - 1);

      } else {

        post.likedBy.push(currentUser);

        post.likes =
          (post.likes || 0) + 1;

        if (post.username !== currentUser) {

          addNotification(
            `${currentUser} liked your post.`
          );

        }
      }

      saveData();

      renderFeed();

      renderRightSidebar();
    }


    function deletePost(id) {

      const post =
        posts.find(item => item.id === id);

      if (!post || post.username !== currentUser) {
        return;
      }

      posts =
        posts.filter(item => item.id !== id);

      saveData();

      renderFeed();

      toast("Post deleted.");
    }


    function addComment(id) {

      const input =
        document.getElementById(`comment-${id}`);

      if (!input) {
        return;
      }

      const text =
        input.value.trim();

      if (!text) {
        return;
      }

      const post =
        posts.find(item => item.id === id);

      if (!post) {
        return;
      }

      if (!post.comments) {
        post.comments = [];
      }

      post.comments.push({
        username: currentUser,
        text
      });

      if (post.username !== currentUser) {

        addNotification(
          `${currentUser} commented on your post.`
        );

      }

      saveData();

      renderFeed();

      toast("Comment added.");
    }


    function focusComment(id) {

      const input =
        document.getElementById(`comment-${id}`);

      if (input) {
        input.focus();
      }
    }


    function commentKey(event, id) {

      if (event.key === "Enter") {
        addComment(id);
      }
    }


    /* =========================
       COMMUNITIES
    ========================== */

    function renderCommunities() {
      const main = document.getElementById("mainContent");
      const categories = ["All", ...Array.from(new Set(communities.map(c => c.category || "General")))];
      const featured = [...communities].sort((a,b)=>(b.members||0)-(a.members||0)).slice(0,8);

      main.innerHTML = `
        <div class="page">
          <h1 class="page-title">Groups & Communities</h1>
          <p style="color:#9db0d0;margin-top:-8px;">Search, scroll, and discover groups based on your interests.</p>
          <section class="groups-discovery">
            <div class="groups-search-row">
              <input id="communitySearchInput" class="groups-search" placeholder="Search groups and communities..." oninput="filterCommunities()" autocomplete="off" />
              <button class="primary-button" onclick="createCommunity()">Create Group</button>
            </div>
            <div class="group-filters" id="communityFilters">
              ${categories.map((category,index)=>`<button class="group-filter ${index===0?'active':''}" onclick="setCommunityFilter('${escapeHTML(category).replace(/'/g,"\\'")}', this)">${escapeHTML(category)}</button>`).join("")}
            </div>
            ${featured.length ? `
              <h2 class="groups-section-title">Featured Groups</h2>
              <div class="featured-groups">
                ${featured.map(c=>{const joined=c.joinedBy?.includes(currentUser);return `<article class="featured-group"><span class="group-category">${escapeHTML(c.category||'General')}</span><h3>${escapeHTML(c.name)}</h3><p style="color:#a9bad8;">${escapeHTML(c.description||'A United Network community.')}</p><div class="group-meta"><span>${c.members||0} members</span><button class="${joined?'danger-button':'primary-button'}" onclick="toggleCommunity(${c.id})">${joined?'Leave':'Join'}</button></div></article>`;}).join("")}
              </div>` : ""}
            <h2 class="groups-section-title">Browse All Groups</h2>
            <div id="communityResultsCount" class="groups-results-count"></div>
            <div id="communityBrowseGrid" class="community-grid"></div>
          </section>
        </div>`;
      renderCommunityBrowse();
    }

    let activeCommunityFilter = "All";

    function setCommunityFilter(category, button) {
      activeCommunityFilter=category;
      document.querySelectorAll("#communityFilters .group-filter").forEach(item=>item.classList.remove("active"));
      if(button) button.classList.add("active");
      renderCommunityBrowse();
    }

    function filterCommunities(){ renderCommunityBrowse(); }

    function renderCommunityBrowse(){
      const grid=document.getElementById("communityBrowseGrid");
      if(!grid) return;
      const input=document.getElementById("communitySearchInput");
      const query=input ? input.value.trim().toLowerCase() : "";
      const filtered=communities.filter(c=>{
        const category=c.category||"General";
        const matchesCategory=activeCommunityFilter==="All" || category===activeCommunityFilter;
        const searchable=`${c.name||""} ${c.description||""} ${category}`.toLowerCase();
        return matchesCategory && (!query || searchable.includes(query));
      });
      const count=document.getElementById("communityResultsCount");

    function toggleCommunity(id) {

        communities.find(item => item.id === id);

        return;

        community.joinedBy = [];

      const index =
        community.joinedBy.indexOf(currentUser);

      if (index >= 0) {

        community.joinedBy.splice(index, 1);

        community.members =
          Math.max(0, community.members - 1);

        toast(`Left ${community.name}.`);

        community.joinedBy.push(currentUser);

    function sendMessage() {

      const input =
        document.getElementById("messageInput");

      if (!input) {
        return;
      }

      const text =
        input.value.trim();

      if (!text) {
        return;
      }

      const conversation =
        messages.find(
          message =>
            message.id === activeConversation
        );

      if (!conversation) {
        return;

      conversation.messages.push({
        from: currentUser,
        text,
        time: Date.now()
      });

      saveData();

      renderMessages();

      setTimeout(() => {

          document.querySelector(".chat-messages");

        if (chat) {
          chat.scrollTop = chat.scrollHeight;

    function formatTime(timestamp) {

      if (!timestamp) {
        return "";
      }

      const difference =
        Date.now() - timestamp;

      const seconds =
        Math.floor(difference / 1000);

      if (seconds < 60) {
        return "Just now";
      }

      const minutes =
        Math.floor(seconds / 60);

      if (minutes < 60) {
        return `${minutes}m ago`;
      }

      const hours =
        Math.floor(minutes / 60);

      if (hours < 24) {
        return `${hours}h ago`;
      }

      const days =
        Math.floor(hours / 24);

      return `${days}d ago`;
    }


    function escapeHTML(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function toast(message) {

      const element =
        document.getElementById("toast");

      element.textContent =
        message;

      element.classList.add("show");

      clearTimeout(
        window.__toastTimer
      );

      window.__toastTimer =
        setTimeout(() => {

          element.classList.remove("show");

        }, 2500);
    }
